name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native Pixiv ECH transport
        # SwiftPM requires the local binary target before manifest resolution.
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          RUSTUP_TOOLCHAIN=1.98.1 bash Native/PixivTransport/build.sh
          RUSTFLAGS="--cfg reqwest_unstable" cargo +1.98.1 test --manifest-path Native/PixivTransport/Cargo.toml

      - name: Run SetuIOSCore unit tests (swift test)
        run: swift test

      - name: Regenerate project check (XcodeGen drift guard)
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code SetuIOSApp.xcodeproj/project.pbxproj \
            || (echo "::error::project.pbxproj 与 project.yml 不一致，请运行 xcodegen generate 后提交" && exit 1)

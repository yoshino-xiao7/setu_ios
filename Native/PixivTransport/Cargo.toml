[package]
name = "setu-pixiv-transport"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rustls = "=0.23.40"
webpki-roots = "1"
setu-rhttp-native = { path = "vendor/rhttp-native" }
chrono = "0.4.45"
reqwest = { path = "vendor/rhttp-native/third_party/reqwest", version = "0.13.4", default-features = false, features = ["blocking", "rustls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = "0.26"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

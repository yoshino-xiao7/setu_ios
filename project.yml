name: SetuIOSApp
options:
  bundleIdPrefix: icu.yukiryou
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7G6J4S76PN
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "5"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  SetuIOSCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SetuIOSCore
    dependencies:
      - framework: Native/PixivTransport/build/SetuPixivTransport.xcframework
        embed: false
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: icu.yukiryou.setuios.core
        DEFINES_MODULE: NO
        SWIFT_INSTALL_OBJC_HEADER: NO
        ENABLE_TESTABILITY: YES

  SetuIOSApp:
    type: application
    platform: iOS
    sources:
      # Recursively includes P13 Music/Player and Music/Lyrics.
      - path: Sources/SetuIOSApp
        excludes:
          - Resources
          - Info.plist
      - path: Sources/SetuIOSApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/SetuIOSApp/Resources/ZIPFoundation-LICENSE.txt
        buildPhase: resources
      - path: Native/PixivTransport/build/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - target: SetuIOSCore
      - target: SetuIOSLiveActivityWidget
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Supplementary plist merged with the generated keys. Required for the
        # `audio` background mode, which has no INFOPLIST_KEY_* equivalent.
        INFOPLIST_FILE: Sources/SetuIOSApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: icu.yukiryou.setuios
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: 亦可 YK
        INFOPLIST_KEY_CFBundleName: 亦可 YK
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 将图片保存到你的照片图库
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: SetuIOSApp.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  SetuIOSLiveActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SetuIOSLiveActivityWidget
    dependencies:
      - target: SetuIOSCore
    info:
      path: Sources/SetuIOSLiveActivityWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: icu.yukiryou.setuios.liveactivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  SetuIOSAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SetuIOSAppTests
    dependencies:
      - target: SetuIOSCore
      - target: SetuIOSApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: icu.yukiryou.setuios.tests

  SetuVLCIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/VLCIntegrationTests
      - path: Tests/SetuIOSAppTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SetuIOSApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: icu.yukiryou.setuios.vlctests
        SWIFT_OBJC_BRIDGING_HEADER: Tests/VLCIntegrationTests/VLCAudioProbe.h

  SetuIOSAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SetuIOSAppUITests
    dependencies:
      - target: SetuIOSApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: icu.yukiryou.setuios.uitests
        TEST_TARGET_NAME: SetuIOSApp

schemes:
  SetuIOSApp:
    build:
      targets:
        SetuIOSApp: all
        SetuIOSCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SetuIOSAppTests
        - SetuIOSAppUITests
        - SetuVLCIntegrationTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug

  SetuImages:
    build:
      targets:
        SetuIOSApp: all
        SetuIOSCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SetuIOSAppTests
        - SetuIOSAppUITests
